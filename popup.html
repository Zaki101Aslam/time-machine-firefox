<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
    
    :root {
      --neon: #00ff66;
      --neon-glow: rgba(0, 255, 102, 0.3);
      --bg: #0a0a0a;
    }

    body { 
      width: 270px; 
      padding: 16px; 
      margin: 0;
      background: var(--bg); 
      color: var(--neon); 
      font-family: 'VT323', 'Courier New', 'Consolas', monospace; 
      font-size: 18px; 
      border: 2px solid var(--neon); 
      box-shadow: inset 0 0 15px var(--neon-glow), 0 0 10px var(--neon-glow);
      box-sizing: border-box;
      user-select: none;
      transition: border-color 0.3s, color 0.3s, box-shadow 0.3s;
    }

    h3 { 
      text-align: center; 
      border-bottom: 1px dashed var(--neon); 
      padding-bottom: 8px; 
      text-transform: uppercase; 
      letter-spacing: 2px; 
      margin: 0 0 14px 0;
      font-size: 22px;
      text-shadow: 0 0 8px var(--neon);
      transition: border-color 0.3s, text-shadow 0.3s;
    }

    .row { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-bottom: 13px; 
    }

    .row label.field-title {
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .power-status {
      font-size: 15px;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-left: 8px;
    }
    
    /* Neon Toggle Switch */
    .switch { 
      position: relative; 
      display: inline-block; 
      width: 130px; 
      height: 28px; 
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { 
      position: absolute; 
      cursor: pointer; 
      top: 0; left: 0; right: 0; bottom: 0; 
      background-color: #111; 
      border: 1px solid var(--neon); 
      transition: 0.3s; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
    }
    .slider:before { 
      position: absolute; 
      content: ""; 
      height: 20px; 
      width: 22px; 
      left: 3px; 
      bottom: 3px; 
      background-color: var(--neon); 
      transition: 0.3s; 
      z-index: 2; 
      box-shadow: 0 0 8px var(--neon);
    }
    input:checked + .slider:before { 
      transform: translateX(98px); 
      background-color: var(--neon); 
      box-shadow: 0 0 8px var(--neon);
    }
    
    /* Power Mini Switch */
    .power-switch {
      position: relative;
      display: inline-block;
      width: 54px;
      height: 24px;
    }
    .power-switch input { opacity: 0; width: 0; height: 0; }
    .power-slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #111;
      border: 1px solid var(--neon);
      transition: 0.3s;
    }
    .power-slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: #555;
      transition: 0.3s;
    }
    input:checked + .power-slider:before {
      transform: translateX(28px);
      background-color: var(--neon);
      box-shadow: 0 0 8px var(--neon);
    }

    .mode-label { 
      position: absolute; 
      width: 100%; 
      text-align: center; 
      z-index: 1; 
      pointer-events: none; 
      text-transform: uppercase; 
      font-size: 15px;
      letter-spacing: 1px;
    }
    
    /* Inputs & Buttons */
    input[type="date"] { 
      background: #000; 
      color: var(--neon); 
      border: 1px solid var(--neon); 
      font-family: 'VT323', 'Courier New', 'Consolas', monospace; 
      font-size: 17px; 
      padding: 4px 6px; 
      outline: none; 
      width: 130px;
      box-sizing: border-box;
      box-shadow: 0 0 4px var(--neon-glow);
      transition: border-color 0.3s, color 0.3s, box-shadow 0.3s;
    }

    button { 
      width: 100%; 
      padding: 9px; 
      background: #000; 
      color: var(--neon); 
      border: 2px solid var(--neon); 
      font-family: 'VT323', 'Courier New', 'Consolas', monospace; 
      font-size: 20px; 
      cursor: pointer; 
      text-transform: uppercase; 
      letter-spacing: 2px; 
      transition: all 0.2s;
      box-shadow: 0 0 8px var(--neon-glow);
      margin-top: 4px;
    }
    button:hover { 
      background: var(--neon); 
      color: #000; 
      box-shadow: 0 0 14px var(--neon);
    }

    button.secondary-btn {
      font-size: 15px;
      padding: 7px;
      letter-spacing: 1px;
      border-style: dashed;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <h3>Time Machine</h3>
  
  <div class="row">
    <label class="field-title">Power:</label>
    <div style="display: flex; align-items: center;">
      <label class="power-switch">
        <input type="checkbox" id="toggleFilter" checked>
        <span class="power-slider"></span>
      </label>
      <span class="power-status" id="powerText">ON</span>
    </div>
  </div>

  <div class="row">
    <label class="field-title">Mode:</label>
    <label class="switch">
      <input type="checkbox" id="modeToggle">
      <span class="slider"></span>
      <span class="mode-label" id="modeText">Filter Future</span>
    </label>
  </div>

  <div class="row">
    <label class="field-title">Target Date:</label>
    <input type="date" id="dateInput"> 
  </div>

  <button id="saveBtn">Engage</button>
  <button id="archiveBtn" class="secondary-btn" title="Open current webpage at this date in Wayback Machine">🚀 Travel Page to Archive</button>

  <script src="popup.js"></script>
</body>
</html>
